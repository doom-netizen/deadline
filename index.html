function fireBullet(){bul=new T.Group();const b=new T.Mesh(new T.CylinderGeometry(.018,.018,.2,8),new T.MeshBasicMaterial({color:0xffd080}));b.rotation.z=Math.PI/2;bul.add(b);const tr=new T.Mesh(new T.CylinderGeometry(.006,.006,2,6),new T.MeshBasicMaterial({color:0xffb050,transparent:true,opacity:.45}));tr.rotation.z=Math.PI/2;tr.position.x=-1.1;bul.add(tr);bul.position.set(295,1.15,3.5);bul.rotation.y=-Math.atan2(-2.3,5);D.parent.add(bul);bulP=0;shotS()}
function impact(){hitS();flash(.5);const d=new T.Vector3(5,-.05,-2.3).normalize();for(let i=0;i<170;i++){const r=.01+rnd()*.03,m=new T.Mesh(new T.SphereGeometry(r,5,5),new T.MeshBasicMaterial({color:i%3?0x8a0808:0x5a0404}));const back=i%6==0,v=d.clone().multiplyScalar((back?-1.5:2+rnd()*6)).add(new T.Vector3((rnd()-.5)*3,(rnd()-.4)*3,(rnd()-.5)*2.5));spawn(m,new T.Vector3(300,1.15,1.2),v,4,9.8,'b')}dead=1}
function decal(x0,y0,z0,v,floor){if(decals.length>320)return;const r=.02+rnd()*.07,m=new T.Mesh(new T.CircleGeometry(r,10),new T.MeshBasicMaterial({color:[0x8a0808,0x6a0606,0x9a1010,0x4a0404][rnd()*4|0],transparent:true,opacity:.85}));
if(floor){m.rotation.x=-Math.PI/2;m.position.set(x0,.015,z0);m.scale.set(1+rnd()*2,1+rnd()*2,1)}else{m.position.set(x0,y0,.015);m.scale.set(1,1+Math.min(3,Math.abs(v.y)*.5+rnd()),1)}D.parent.add(m);decals.push(m);
if(!floor&&rnd()<.35){const g=new T.BoxGeometry(.012,1,.004);g.translate(0,-.5,0);const dm=new T.Mesh(g,new T.MeshBasicMaterial({color:0x7a0606}));dm.position.set(x0,y0,.016);dm.scale.y=.01;D.parent.add(dm);drips.push({m:dm,max:.1+rnd()*.5,sp:.03+rnd()*.06})}}
function cutWire(){wired=1;flash(.9);tone(900,.3,.4,'sawtooth');for(let i=0;i<40;i++){const m=new T.Mesh(new T.SphereGeometry(.015,5,5),new T.MeshBasicMaterial({color:0xffe080}));spawn(m,new T.Vector3(399.7,.95,0),new T.Vector3((rnd()-.5)*3,rnd()*3,rnd()*2),1,9.8,'s')}bE.ws[0].visible=false;setDisp('00:01','#40ff70');bE.led.material.color.set(0x30ff60)}
function endCard(){tx.style.transition='none';tx.style.top='32%';tx.style.opacity=1;tx.innerHTML='<div class="t"><h1 style="font-size:78px">DEADLINE</h1>'+DR+'</div><div style="font-size:15px;letter-spacing:8px;color:#d8d0b0;margin-top:20px">BREACH &middot; CLEAR &middot; DEFUSE</div>';txUntil=99;cvs.style.visibility='hidden'}
const ev=[[.4,()=>say('3 MINUTES',1.8)],[2.4,()=>say('ONE BOMB',1.8)],[4.1,()=>say('NO SECOND CHANCE',.9)],[5.3,()=>say('BREACH',2)],[8,detonate],[8,()=>tsT=.25],[9.6,()=>tsT=1],[14.2,()=>say('LOCK.',1.2)],[16.6,()=>say('LOAD.',1.2)],[17,()=>tsT=.2],[21,()=>tsT=1],[22.2,()=>{mag.visible=false;const p=new T.Vector3(200.25,-.25,0);spawn(bx(.12,.34,.09,gm,0,0,0,{add(){}}),p,new T.Vector3(.1,-.5,.4),4,9.8,'c');for(let i=0;i<9;i++)spawn(new T.Mesh(new T.CylinderGeometry(.012,.012,.06,8),cm),new T.Vector3(200.25+(rnd()-.5)*.1,-.2,0),new T.Vector3((rnd()-.5)*.6,-.2,.2+rnd()*.5),5,9.8,'c')}],[23.3,()=>say('CLEAR.',1.5)],[24,fireBullet],[24,()=>tsT=.16],[29.5,()=>tsT=1],[31,()=>say('NO MERCY',1.6)],[33.4,()=>say('DEFUSE.',2)],[40,cutWire],[41.5,endCard]];
const fin=()=>{if(done)return;done=true;removeEventListener('keydown',esc);try{if(dr){dr.a.stop();dr.b.stop()}if(AC)AC.close()}catch(e){}RD.dispose();ov.remove()};
const esc=e=>{if(e.key=='Escape')fin()};addEventListener('keydown',esc);ov.querySelector('.sk').onclick=fin;
function upd(dt){t+=dt;ts+=(tsT-ts)*Math.min(1,dt*8);const pd=dt*ts;
for(const e of ev)if(!e[2]&&t>=e[0]){e[2]=1;e[1]()}if(t>txUntil)tx.style.opacity=0;
if(dr){dr.g.gain.value=Math.min(.16,.03+t*.004);dr.f.frequency.value=150+t*18}
const sec=Math.floor(t);if(sec!=tk){tk=sec;if(t<5||(t>33&&t<40))tickS()}
fv*=.9;fl.style.opacity=fv;shake*=.94;const sh=()=>(rnd()-.5)*shake*.25;
if(t<5){cam.position.set(sh(),.9-t*.03,2.6-t*.85);cam.lookAt(0,.4,-5);redL.intensity=1.5+Math.abs(Math.sin(t*3))*2.5;bA.led.visible=Math.sin(t*6)>0}
else if(t<14){if(t<8){cam.position.set(100-2.6+(t-5)*.25+sh(),1.5-(t-5)*.05,4.2-(t-5)*.3);cam.lookAt(100,1.2,0);chgM.material.emissiveIntensity=Math.sin(t*10)>0?1:.1}else{cam.position.set(100.8+sh(),1.45+sh(),3.2-(t-8)*.75);cam.lookAt(100,1.3,-8)}
swat.forEach((h,i)=>{poseAim(h,-.1);if(t>8.2){const s=(t-8.2-i*.3)*2.2,z=Math.max(-6,1.4+i*.9-Math.max(0,s));h.position.z=z;h.position.x=-1.8*Math.max(0,Math.min(1,z/1.5));poseWalk(h,t*2.4+i,.35)}});doorL.intensity=Math.max(1.2,dLv);dLv*=.93}
else if(t<23){const a=.3+(t-14)*.09;cam.position.set(200.6+Math.sin(a)*2.3,.15+.2*Math.sin(t*.5),Math.cos(a)*2.3);cam.lookAt(200.6,-.1,0);while(gi<shots.length&&t>=shots[gi]){fire();gi++}
gunK*=.85;gun.position.x=-.05*gunK;gun.rotation.z=.05*gunK;fm.opacity*=.5;f1.scale.set(1+rnd()*.5,1+rnd(),1);mLv*=.6;mL.intensity=mLv}
else if(t<33){const k=(t-23)/10;cam.position.set(301.5+k*.4+sh(),1.4-k*.05,5.6-k*1.3);cam.lookAt(301.6,1.2,.6);
if(bul){bulP+=pd*14/5.6;if(bulP<1){bul.position.set(295+5*bulP,1.15,3.5-2.3*bulP)}else{D.parent.remove(bul);bul=null;impact()}}
}
else if(t<41){const k=(t-33)/8;cam.position.set(400.3-k*.2,1.1-k*.35,2.4-k*1);cam.lookAt(400,.55,0);if(!wired){const n=Math.max(1,9-Math.floor((t-33.4)/.8));setDisp('00:0'+n)}bE.led.visible=wired||Math.sin(t*8)>0}
for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=pd;p.v.y-=p.g*pd;p.m.position.addScaledVector(p.v,pd);if(p.k=='d'||p.k=='c'){p.m.rotation.x+=p.spin.x*pd;p.m.rotation.z+=p.spin.z*pd}
if(p.k=='c'&&p.m.position.y<-.78){p.m.position.y=-.78;if(Math.abs(p.v.y)>.6)hitS();p.v.y*=-.4;p.v.x*=.6;p.v.z*=.6;p.spin.multiplyScalar(.6)}
if(p.k=='d'&&p.m.position.y<.05&&p.m.position.x<150){p.m.position.y=.05;p.v.y*=-.3;p.v.x*=.7;p.v.z*=.7}
if(p.k=='m'){p.m.scale.multiplyScalar(1+pd*2);p.m.material.opacity=Math.max(0,p.life/3.2)}
if(p.k=='b'){const q=p.m.position;if(q.z<=.03){decal(q.x,q.y,0,p.v,false);p.life=0}else if(q.y<=.02){decal(q.x,0,q.z,p.v,true);p.life=0}}
if(p.life<=0){p.par.remove(p.m);parts.splice(i,1)}}
for(const d of drips)if(d.m.scale.y<d.max)d.m.scale.y+=d.sp*pd;
enH.userData.armR.rotation.x=-1.35+Math.sin(t*3)*.05;if(dead&&t>25){const e=Math.min(1,Math.max(0,(t-25.3)/2.2));en.rotation.z=-e*1.45;en.position.x=e*.7;en.position.y=e*.15;enH.userData.armR.rotation.x=-.3-e*.8;enH.userData.armL.rotation.x=-.2-e*.6}
RD.render(sc,cam)}
function loop(){if(done)return;requestAnimationFrame(loop);const n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;try{upd(dt)}catch(e){console.error(e);fin();return}if(t>47)fin()}
loop()}

bootTheme();document.addEventListener('click',function once(){bootTheme();document.removeEventListener('click',once)});
showMain();
</script></body></html>
